---
name: "Validate PR Title"
# Ensure that the PR title conforms to the Conventional Commits specification and our choice of types, so the squash-merge commit subject stays Conventional-Commits clean.

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: python3 .github/check-conventional-pr-title.py
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
