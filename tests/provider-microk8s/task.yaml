summary: Run concierge with just a MicroK8s provider
systems:
  - ubuntu-24.04

execute: |
  pushd "${SPREAD_PATH}/${SPREAD_TASK}"

  "$SPREAD_PATH"/concierge --trace prepare --extra-snaps="yq"

  list="$(snap list microk8s)"
  echo $list | MATCH microk8s
  echo $list | MATCH 1.31-strict/stable

  list="$(snap list)"
  echo $list | MATCH juju
  echo $list | MATCH kubectl

  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="hostpath-storage") | .status'
  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="dns") | .status'
  sudo microk8s status --format yaml | yq '.addons[] | select(.name=="metallb") | .status'

  kubectl config current-context | MATCH "microk8s"

  juju controllers | tail -n1 | MATCH concierge-microk8s
  juju models | tail -n1 | MATCH testing

restore: |
  if [[ -z "${CI:-}" ]]; then
    "$SPREAD_PATH"/concierge --trace restore
  fi

debug: |
  # `microk8s enable metallb` hangs here but not upstream, and the failure
  # output only tells us which command was running, so dump enough state to
  # see what it was actually waiting on. Everything is time-limited because
  # a wedged cluster makes these hang too.
  echo "===== process tree ====="
  ps auxf || true

  echo "===== microk8s status ====="
  timeout 60 microk8s status || true

  echo "===== nodes ====="
  timeout 60 microk8s kubectl get nodes -o wide || true

  echo "===== all resources ====="
  timeout 60 microk8s kubectl get all -A || true

  echo "===== recent events ====="
  timeout 60 microk8s kubectl get events -A --sort-by=.lastTimestamp | tail -n 50 || true

  echo "===== metallb pods ====="
  timeout 60 microk8s kubectl describe pods -n metallb-system || true

  echo "===== logs from unready pods ====="
  # The kubelet journal only says a container is backing off, never why it
  # exited, so go to the container's own output. `--previous` is the crashed
  # instance rather than the one waiting to start. Don't select on
  # `status.phase`: a pod in CrashLoopBackOff still reports `Running`, so
  # filter on the containers' ready flags instead.
  timeout 120 microk8s kubectl get pods -A \
    -o 'jsonpath={range .items[?(@.status.containerStatuses[*].ready==false)]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' |
    while read -r ns pod; do
      [ -n "$pod" ] || continue
      echo "----- $ns/$pod (previous) -----"
      timeout 60 microk8s kubectl logs -n "$ns" "$pod" --previous --all-containers --tail=50 || true
      echo "----- $ns/$pod (current) -----"
      timeout 60 microk8s kubectl logs -n "$ns" "$pod" --all-containers --tail=50 || true
    done

  echo "===== resolv.conf ====="
  # CoreDNS kills itself when its `loop` plugin sees a forwarding loop, which
  # is what a stub resolver at 127.0.0.53 gives you.
  cat /etc/resolv.conf || true
  cat /run/systemd/resolve/resolv.conf || true

  echo "===== host resources ====="
  nproc || true
  free -m || true
  df -h / || true

  echo "===== microk8s daemon journal ====="
  journalctl -u 'snap.microk8s.*' --no-pager --since '-30 min' | tail -n 100 || true
