[project]
name = "charm-concierge"
version = "0.1.0"
description = "A tool to provision and manage charm development environments"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Tony Meyer", email="tony@aotearoa.dev"}
]
dependencies = [
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
]

[project.scripts]
concierge = "concierge.cli.app:main"
charm-concierge = "concierge.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "ty>=0.0.1a34",
    "zizmor>=1.28.0",
]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "ANN401",
    "PLR0913",
    "PLR0912",
    "PLR2004",
    "TRY003",
    "TRY004",
    "TRY300",
    "TRY301",
    "TRY400",
    "TRY002",
    # Method docstrings are not mandated; module/class/function docs are.
    "D102",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]
